name: Deploy GRIDPULSE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate dashboard JavaScript
        run: |
          node --check dashboard.js
          node --check dashboard-extras.js
          node --check weather-overlays.js
          node --check v3-intelligence.js
          node --check v3-areas.js
          node --check v3-environment.js
          node --check v3-map-areas.js
          node --check v3-refinements.js
          node --check swin-focus.js
          node --check swin-header-picture.js
          node --check swin-workbench.js
          node --check swin-zones.js
          node --check operational-facilities.js
          node --check gridpulse-brand.js
          node --check main-roads-cleanup.js
          node --check wp-source-clarity.js
          node --check sw.js
          node --check worker/src/history.js
          node --check worker/src/index-v9.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
