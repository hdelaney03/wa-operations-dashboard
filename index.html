<!doctype html>
<html lang="en-AU" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071019" />
  <meta name="description" content="WA Operations Dashboard — a personal Western Australian situational-awareness workspace for weather, warnings and operational information." />
  <title>WAOS — WA Operations Dashboard</title>
  <link rel="icon" href="assets/waos-mark.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=503" />\n  <link rel="stylesheet" href="native-map.css?v=503" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="WA Operations Dashboard">
        <img src="assets/waos-mark.svg" alt="" class="brand-mark" />
        <div class="brand-copy">
          <span class="brand-kicker">WA OPERATIONS</span>
          <strong>WAOS</strong>
        </div>
      </div>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" inputmode="search" placeholder="Search a WA suburb, town or address" aria-label="Search Western Australia" />
        <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>
          <svg class="icon"><use href="#i-x"></use></svg>
        </button>
        <button class="search-submit" type="submit">Search</button>
        <div class="search-results" id="searchResults" role="listbox" hidden></div>
      </form>

      <div class="top-status">
        <button class="status-chip" id="systemChip" type="button" data-panel="status" title="Open system status">
          <span class="status-led pending" id="systemLed"></span>
          <span><small>System</small><strong id="systemText">Starting</strong></span>
        </button>
        <div class="clock-chip" title="Perth time">
          <small>PERTH</small>
          <strong id="clock">--:--</strong>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle colour theme" title="Toggle colour theme">
          <svg class="icon"><use href="#i-moon"></use></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <nav class="rail" aria-label="Dashboard tools">
        <div class="rail-main">
          <button class="rail-button active" type="button" data-panel="layers" aria-label="Map layers" title="Map layers (L)">
            <svg class="icon"><use href="#i-layers"></use></svg><span>Layers</span>
          </button>
          <button class="rail-button" type="button" data-panel="alerts" aria-label="Warnings" title="Warnings (A)">
            <span class="count-badge" id="railAlertCount" hidden>0</span>
            <svg class="icon"><use href="#i-alert"></use></svg><span>Alerts</span>
          </button>
          <button class="rail-button" type="button" data-panel="weather" aria-label="Weather" title="Weather (W)">
            <svg class="icon"><use href="#i-cloud"></use></svg><span>Weather</span>
          </button>
          <button class="rail-button" type="button" data-panel="status" aria-label="Data status" title="Data status">
            <svg class="icon"><use href="#i-pulse"></use></svg><span>Status</span>
          </button>
        </div>
        <div class="rail-foot">
          <button class="rail-button" type="button" data-panel="sources" aria-label="Official sources" title="Official sources">
            <svg class="icon"><use href="#i-link"></use></svg><span>Sources</span>
          </button>
          <button class="rail-button" type="button" data-panel="settings" aria-label="Settings" title="Settings">
            <svg class="icon"><use href="#i-settings"></use></svg><span>Settings</span>
          </button>
        </div>
      </nav>

      <aside class="drawer left-drawer open" id="leftDrawer" aria-live="polite">
        <div class="drawer-head">
          <div>
            <span class="eyebrow" id="panelEyebrow">MAP</span>
            <h2 id="panelTitle">Layers</h2>
          </div>
          <button class="icon-button ghost" id="closeDrawer" type="button" aria-label="Close panel"><svg class="icon"><use href="#i-x"></use></svg></button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
      </aside>

      <section class="map-wrap" aria-label="Operational map">
        <div id="map"></div>
        <div id="mapFallback" class="map-fallback" hidden>
          <strong>Map unavailable</strong>
          <span>Weather, warning cards and official source links remain available.</span>
        </div>

        <div class="map-tools top-left">
          <button class="map-tool" type="button" id="locateBtn" title="Use my location" aria-label="Use my location"><svg class="icon"><use href="#i-location"></use></svg></button>
          <button class="map-tool" type="button" id="homeBtn" title="Perth Metro" aria-label="Reset to Perth Metro"><svg class="icon"><use href="#i-home"></use></svg></button>
          <button class="map-tool" type="button" id="fitAlertsBtn" title="Fit current mapped warnings" aria-label="Fit current mapped warnings"><svg class="icon"><use href="#i-focus"></use></svg></button>
        </div>

        <div class="map-tools top-right view-switcher" role="group" aria-label="Map view">
          <button type="button" data-view="perth">Perth</button>
          <button type="button" class="active" data-view="metro">Metro</button>
          <button type="button" data-view="wa">WA</button>
        </div>

        <div class="map-summary" id="mapSummary">
          <span class="live-ring"></span>
          <div><strong id="mapSummaryTitle">Perth Metro</strong><span id="mapSummaryText">Loading operational data…</span></div>
        </div>

        <div class="map-legend" id="mapLegend" aria-label="Map legend"></div>

        <button class="floating-alerts" id="floatingAlerts" type="button" data-panel="alerts" hidden>
          <svg class="icon"><use href="#i-alert"></use></svg>
          <span><strong id="floatingAlertCount">0</strong><small>current warnings</small></span>
        </button>

        <div class="selection-card" id="selectionCard" hidden>
          <button class="selection-close" id="selectionClose" type="button" aria-label="Close location card"><svg class="icon"><use href="#i-x"></use></svg></button>
          <span class="eyebrow">SELECTED LOCATION</span>
          <strong id="selectionName">—</strong>
          <span id="selectionCoords">—</span>
          <div class="selection-actions">
            <button class="button secondary compact" id="selectionWeatherBtn" type="button">View weather</button>
            <button class="button subtle compact" id="selectionCopyBtn" type="button">Copy coordinates</button>
          </div>
        </div>
      </section>
    </main>

    <div class="mobile-nav" aria-label="Mobile dashboard navigation">
      <button class="active" type="button" data-panel="layers"><svg class="icon"><use href="#i-layers"></use></svg><span>Layers</span></button>
      <button type="button" data-panel="alerts"><svg class="icon"><use href="#i-alert"></use></svg><span>Alerts</span></button>
      <button type="button" data-panel="weather"><svg class="icon"><use href="#i-cloud"></use></svg><span>Weather</span></button>
      <button type="button" data-panel="status"><svg class="icon"><use href="#i-pulse"></use></svg><span>Status</span></button>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>
  </div>

  <svg width="0" height="0" class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Zm0 6v5m0 3h.01"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H7a5 5 0 1 1 1.1-9.88A6.5 6.5 0 0 1 20 12.5 3.5 3.5 0 0 1 17.5 19Z"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07.07l2-2A5 5 0 0 0 12 4m2 7a5 5 0 0 0-7.07-.07l-2 2A5 5 0 0 0 12 20"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 3.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2v-4h.1A1.7 1.7 0 0 0 3.6 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8 3.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2h4v.1A1.7 1.7 0 0 0 15 3.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.7 1.6Z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></symbol>
    <symbol id="i-location" viewBox="0 0 24 24"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Zm0-8.5A2.5 2.5 0 1 1 12 7a2.5 2.5 0 0 1 0 5.5Z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-6h6v6"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6.1 9A7 7 0 0 1 18 7.5L20 11M4 13l2 3.5A7 7 0 0 0 17.9 15"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9M20 14v6H4V4h6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></symbol>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js?v=502"></script>
  <script src="app.js?v=502"></script>
</body>
</html>
